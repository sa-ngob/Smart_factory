<!doctype html>
<html lang="th" data-bs-theme="dark">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Operator View - Smart Factory</title>
    <link href="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/css/tabler.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet">
    <style>
        .kpi-value {
            font-size: 3rem;
            font-weight: 700;
            line-height: 1;
        }

        .kpi-label {
            font-size: 1rem;
            color: #888;
            margin-bottom: 0.5rem;
        }

        .progress-bar-striped {
            background-image: linear-gradient(45deg, rgba(255, 255, 255, .15) 25%, transparent 25%, transparent 50%, rgba(255, 255, 255, .15) 50%, rgba(255, 255, 255, .15) 75%, transparent 75%, transparent);
            background-size: 1rem 1rem;
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="page-wrapper">
            <div class="page-header d-print-none">
                <div class="container-fluid">
                    <div class="row align-items-center">
                        <div class="col">
                            <h1 class="page-title" id="machine-name-title">Loading...</h1>
                        </div>
                        <div class="col-auto ms-auto">
                            <a href="./operator.html" class="btn btn-outline-secondary">
                                <i class="ti ti-arrow-left"></i> กลับไปหน้าเลือกเครื่องจักร
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="page-body">
                <div class="container-fluid">
                    <div class="row g-4">

                        <div class="col-md-12 col-lg-7">
                            <div class="card" style="min-height: 85vh;">
                                <div class="card-status-top bg-success"></div>
                                <div class="card-header">
                                    <h3 class="card-title">
                                        <i class="ti ti-player-play-filled me-2"></i> งานที่กำลังผลิต (In Progress)
                                    </h3>
                                </div>
                                <div class="card-body" id="in-progress-card-body">
                                    <div class="text-center text-muted py-5">กำลังโหลดข้อมูล...</div>
                                </div>
                            </div>
                        </div>

                        <div class="col-md-12 col-lg-5">

                            <div class="card mb-3">
                                <div class="card-header">
                                    <h3 class="card-title"><i class="ti ti-list me-2"></i> คิวงานถัดไป (Job Queue)</h3>
                                </div>
                                <div class="table-responsive">
                                    <table class="table table-vcenter card-table">
                                        <thead>
                                            <tr>
                                                <th>MO Number</th>
                                                <th>Item Name</th>
                                                <th class="text-end">จำนวน</th>
                                                <th class="text-end">เลือก</th>
                                            </tr>
                                        </thead>
                                        <tbody id="pending-jobs-table"></tbody>
                                    </table>
                                </div>
                            </div>

                            <div class="card" style="min-height: 40vh;">
                                <div class="card-header">
                                    <h3 class="card-title"><i class="ti ti-history me-2"></i> บันทึกผลผลิตล่าสุด</h3>
                                </div>
                                <div class="table-responsive">
                                    <table class="table table-vcenter card-table">
                                        <thead>
                                            <tr>
                                                <th>วันที่/เวลา</th>
                                                <th>ผู้บันทึก</th>
                                                <th class="text-end text-success">ของดี</th>
                                                <th class="text-end text-danger">ของเสีย</th>
                                            </tr>
                                        </thead>
                                        <tbody id="production-records-table">
                                            <tr>
                                                <td colspan="4" class="text-center text-muted">กำลังโหลด...</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/js/tabler.min.js"></script>
    <script src="/js/auth-client.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            let currentJobInfo = null;
            let currentMachineId = null;

            // ฟังก์ชันสำหรับจบงาน
            window.handleStopJob = async function (moNumber) {
                if (confirm(`คุณต้องการจบงาน ${moNumber} ใช่หรือไม่?`)) {
                    try {
                        // เรียกใช้ fetchWithAuth หรือ fetch ธรรมดาตามระบบของคุณ
                        const response = await fetch('/api/dashboard/stop-job', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ mo_number: moNumber })
                        });
                        const result = await response.json();
                        if (result.success) {
                            alert(result.message);
                            fetchData(); // โหลดข้อมูลใหม่
                        } else {
                            alert('Error: ' + result.error);
                        }
                    } catch (error) {
                        alert('เกิดข้อผิดพลาดในการเชื่อมต่อ');
                    }
                }
            };

            // ฟังก์ชันสำหรับเริ่มงาน (Job Queue)
            window.handleStartJob = async function (moNumber) {
                if (!currentMachineId) {
                    alert('Error: Machine ID not loaded');
                    return;
                }
                if (currentJobInfo) {
                    alert('กรุณาจบงานปัจจุบันก่อนเริ่มงานใหม่');
                    return;
                }

                if (confirm(`ยืนยันเริ่มผลิตงาน ${moNumber}?`)) {
                    try {
                        const response = await fetch('/api/dashboard/start-specific-job', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                mo_number: moNumber,
                                machine_id: currentMachineId
                            })
                        });
                        const result = await response.json();
                        if (result.success) {
                            // alert(result.message); // Optional
                            window.location.reload(); // Reload to update state
                        } else {
                            alert('Error: ' + result.error);
                        }
                    } catch (error) {
                        alert('เกิดข้อผิดพลาดในการเชื่อมต่อ: ' + error.message);
                    }
                }
            };

            // ฟังก์ชัน Render ข้อมูลงานปัจจุบัน
            const renderInProgress = (job) => {
                const container = document.getElementById('in-progress-card-body');

                if (!job) {
                    container.innerHTML = `<div class="empty">
                        <div class="empty-icon"><i class="ti ti-player-stop" style="font-size: 3rem;"></i></div>
                        <p class="empty-title">ไม่มีงานกำลังผลิต</p>
                    </div>`;
                    document.getElementById('production-records-table').innerHTML = '<tr><td colspan="4" class="text-center text-secondary">--</td></tr>';
                    return;
                }

                // คำนวณ %
                // คำนวณ % โดยแปลง string เป็น number เสมอ
                // ถ้า Backend ส่ง calculated_total_produced มาให้ใช้ค่านี้ (จาก Counter * Cavity)
                const good = parseInt(job.total_good || 0);
                const scrap = parseInt(job.total_scrap || 0);

                // Use backend calculated value if available (realtime from counter), otherwise fallback to recorded sum
                const totalProduced = (job.calculated_total_produced !== undefined)
                    ? parseInt(job.calculated_total_produced)
                    : (good + scrap);

                const totalTarget = parseInt(job.quantity_to_produce || 0);
                const progressPercent = totalTarget > 0 ? ((totalProduced / totalTarget) * 100).toFixed(1) : 0;
                const diff = totalProduced - totalTarget;

                // สร้าง HTML
                container.innerHTML = `
                    <div class="row mb-4">
                        <div class="col-6">
                            <div class="text-muted small">MO NUMBER</div>
                            <div class="h2 text-primary">${job.mo_number}</div>
                        </div>
                        <div class="col-6 text-end">
                            <div class="text-muted small">ITEM</div>
                            <div class="h3">${job.item_code} - ${job.item_name || ''}</div>
                        </div>
                    </div>

                    <div class="mb-4">
                        <div class="d-flex justify-content-between mb-1">
                            <span>ความคืบหน้า</span>
                            <span class="fw-bold text-success">${totalProduced} / ${totalTarget}</span>
                        </div>
                        <div class="progress progress-xl">
                            <div class="progress-bar progress-bar-striped progress-bar-animated bg-primary" 
                                 style="width: ${progressPercent}%"></div>
                        </div>
                        <div class="text-center mt-2 text-muted small">${progressPercent}% Completed</div>
                    </div>

                    <div class="row g-3 text-center mb-5">
                        <div class="col-6">
                            <div class="card bg-dark-lt">
                                <div class="card-body">
                                    <div class="kpi-label text-success">ของดี</div>
                                    <div class="kpi-value text-success">${good}</div>
                                </div>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="card bg-dark-lt">
                                <div class="card-body">
                                    <div class="kpi-label text-danger">ของเสีย</div>
                                    <div class="kpi-value text-danger">${scrap}</div>
                                </div>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="card bg-dark-lt">
                                <div class="card-body">
                                    <div class="kpi-label text-primary">ยอดผลิตรวม</div>
                                    <div class="kpi-value text-primary">${totalProduced}</div>
                                </div>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="card bg-dark-lt">
                                <div class="card-body">
                                    <div class="kpi-label text-warning">ส่วนต่าง</div>
                                    <div class="kpi-value text-warning">${diff > 0 ? '+' + diff : diff}</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="row g-2 mt-auto">
                        <div class="col-6">
                            <a href="./record-production.html?mo_id=${job.id}&mo_number=${job.mo_number}&returnUrl=${encodeURIComponent(window.location.href)}" 
                               class="btn btn-lg btn-secondary w-100">
                               <i class="ti ti-plus me-2"></i> บันทึกผลผลิต
                            </a>
                        </div>
                        <div class="col-6">
                            <button class="btn btn-lg btn-danger w-100" onclick="handleStopJob('${job.mo_number}')">
                                <i class="ti ti-player-stop-filled me-2"></i> จบงาน
                            </button>
                        </div>
                    </div>
                `;
            };

            // ฟังก์ชัน Render Queue
            const renderPending = (jobs) => {
                const container = document.getElementById('pending-jobs-table');
                if (!jobs || jobs.length === 0) {
                    container.innerHTML = '<tr><td colspan="4" class="text-center text-secondary">ไม่มีคิวงาน</td></tr>';
                    return;
                }

                // Disable start button if job is running
                const isRunning = currentJobInfo !== null;
                const btnState = isRunning ? 'disabled class="btn btn-sm btn-secondary"' : 'class="btn btn-sm btn-success"';

                container.innerHTML = jobs.map(j => `
                    <tr>
                        <td class="text-primary">${j.mo_number}</td>
                        <td>${j.item_name || j.item_code}</td>
                        <td class="text-end">${j.quantity_to_produce}</td>
                        <td class="text-end">
                            <button ${btnState} onclick="handleStartJob('${j.mo_number}')">
                                <i class="ti ti-player-play"></i> เริ่ม
                            </button>
                        </td>
                    </tr>
                `).join('');
            };

            // *** ฟังก์ชันสำคัญ: ดึงประวัติการบันทึกจาก API mo-details ***
            const loadProductionHistory = async (moNumber) => {
                const container = document.getElementById('production-records-table');
                if (!moNumber) return;

                try {
                    // เรียก API ที่มีอยู่ใน dashboard.js บรรทัด 402
                    const res = await fetch(`/api/dashboard/mo-details/${moNumber}`);
                    const json = await res.json();

                    if (json.success && json.data.production_records && json.data.production_records.length > 0) {
                        const records = json.data.production_records;
                        container.innerHTML = records.map(r => {
                            // Ensure valid date handling
                            const dateObj = new Date(r.record_date || r.created_at);
                            const dateStr = dateObj.toLocaleDateString('th-TH');

                            // If record_date is just YYYY-MM-DD (length 10), use 00:00 or don't show time?
                            // Actually r.created_at usually has the timestamp. Use it for time.
                            const timeObj = new Date(r.created_at || r.record_date);
                            const timeStr = timeObj.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });

                            return `
                            <tr>
                                <td>
                                    <div>${dateStr}</div>
                                    <div class="small text-muted">${timeStr}</div>
                                </td>
                                <td>${r.operator_name}</td>
                                <td class="text-end text-success fw-bold">${r.good_quantity}</td>
                                <td class="text-end text-danger">${r.waste_quantity}</td>
                            </tr>
                        `;
                        }).join('');
                    } else {
                        container.innerHTML = '<tr><td colspan="4" class="text-center text-muted">ยังไม่มีการบันทึก</td></tr>';
                    }
                } catch (e) {
                    console.error("Load History Error:", e);
                    container.innerHTML = '<tr><td colspan="4" class="text-center text-danger">โหลดข้อมูลไม่สำเร็จ</td></tr>';
                }
            };

            // ฟังก์ชันหลัก Fetch Data
            const fetchData = async () => {
                const params = new URLSearchParams(window.location.search);
                const machineCode = params.get('machine'); // รับค่า ?machine=MC-001

                if (!machineCode) {
                    document.getElementById('machine-name-title').textContent = "Error: ไม่ระบุรหัสเครื่องจักร";
                    return;
                }

                try {
                    // 1. เรียก API Machine View (dashboard.js บรรทัด 286)
                    const response = await fetch(`/api/dashboard/machine-view/${machineCode}`);
                    const result = await response.json();

                    if (!result.success) throw new Error(result.error);

                    const { machine, inProgressJob, pendingJobs } = result.data;
                    currentMachineId = machine.id;

                    // อัปเดตชื่อเครื่อง
                    document.getElementById('machine-name-title').textContent = `${machine.machine_code} - ${machine.machine_name}`;

                    // อัปเดตส่วนต่างๆ
                    renderInProgress(inProgressJob);
                    renderPending(pendingJobs);

                    // 2. ถ้ามีงานทำอยู่ ให้ไปดึงประวัติการบันทึกมาแสดง (ตารางขวาล่าง)
                    if (inProgressJob) {
                        currentJobInfo = inProgressJob;
                        // เรียกฟังก์ชันแยก เพื่อดึงข้อมูล Table
                        loadProductionHistory(inProgressJob.mo_number);
                    }

                } catch (e) {
                    console.error("Fetch Data Error:", e);
                    document.getElementById('in-progress-card-body').innerHTML = `<div class="alert alert-danger">${e.message}</div>`;
                }
            };

            // เริ่มทำงาน
            fetchData();
            // ตั้งเวลา Auto Refresh ทุก 10 วินาที
            setInterval(fetchData, 10000);
        });
    </script>
</body>

</html>
