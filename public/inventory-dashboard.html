<!doctype html>
<html lang="th" data-bs-theme="dark">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Inventory Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/css/tabler.min.css" rel="stylesheet" />
    <style>
        .kpi-value {
            font-size: 2rem;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="page">
        <aside class="navbar navbar-vertical navbar-expand-lg" data-bs-theme="dark" id="sidebar"></aside>
        <div class="page-wrapper">
            <div class="page-header">
                <div class="container-xl">
                    <h2 class="page-title">Inventory Dashboard</h2>
                </div>
            </div>
            <div class="page-body">
                <div class="container-xl">
                    <div class="row row-cards">
                        <div class="col-md-4">
                            <div class="card card-body bg-yellow-lt">
                                <div class="subheader">มูลค่าสต็อกรวม</div>
                                <div class="kpi-value" id="inv-kpi-total-value">...</div><small
                                    class="text-muted">หมายเหตุ: คำนวณจาก cost_price</small>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card card-body">
                                <div class="subheader">จำนวนสินค้า (SKUs)</div>
                                <div class="kpi-value" id="inv-kpi-total-sku">...</div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card card-body">
                                <div class="subheader">สินค้าใกล้หมด</div>
                                <div class="kpi-value text-warning" id="inv-kpi-low-stock">...</div>
                            </div>
                        </div>
                        <div class="col-md-5">
                            <div class="card">
                                <div class="card-header">
                                    <h3 class="card-title">สัดส่วนสต็อกตามประเภท</h3>
                                </div>
                                <div class="card-body">
                                    <div id="inv-type-chart"></div>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-7">
                            <div class="card">
                                <div class="card-header">
                                    <h3 class="card-title">สินค้าที่ต้องสั่งซื้อเพิ่ม (5 อันดับแรก)</h3>
                                </div>
                                <div class="table-responsive">
                                    <table class="table card-table table-vcenter">
                                        <thead>
                                            <tr>
                                                <th>รหัสสินค้า</th>
                                                <th>ชื่อ</th>
                                                <th>คงเหลือ</th>
                                            </tr>
                                        </thead>
                                        <tbody id="inv-low-stock-table"></tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/js/tabler.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

    <script src="/js/auth-client.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {

            // --- ส่วนที่ 1: ฟังก์ชันพื้นฐานและการตั้งค่าเริ่มต้น ---

            let invChart = null;

            async function loadSidebar() {
                try {
                    const response = await fetchWithAuth('/api/sidebar');
                    const sidebarHtml = await response.text();
                    document.getElementById('sidebar').innerHTML = sidebarHtml;
                    setActiveMenuItem();
                } catch (error) {
                    console.error("Could not load sidebar:", error.message);
                }
            }



            // --- ส่วนที่ 2: ฟังก์ชันสำหรับโหลดและแสดงผลข้อมูล Dashboard ---

            const updateText = (id, value, format = 'number') => {
                const el = document.getElementById(id);
                if (!el) return;
                if (value === undefined || value === null) { el.textContent = '...'; return; }
                if (format === 'currency') el.textContent = `฿${Number(value).toLocaleString('th-TH', { maximumFractionDigits: 0 })}`;
                else el.textContent = Number(value).toLocaleString('th-TH');
            };

            const renderDashboard = (data) => {
                updateText('inv-kpi-total-value', data.total_value, 'currency');
                updateText('inv-kpi-total-sku', data.total_sku);
                updateText('inv-kpi-low-stock', data.low_stock_count);

                const lowStockTable = document.getElementById('inv-low-stock-table');
                lowStockTable.innerHTML = data.low_stock_items.map(item => `
                <tr>
                    <td>${item.item_code}</td>
                    <td>${item.item_name}</td>
                    <td>${item.stock_quantity} ${item.uom || ''}</td>
                </tr>`).join('') || '<tr><td colspan="3" class="text-center text-muted">No low stock items.</td></tr>';

                const chartOptions = {
                    chart: {
                        type: 'donut',
                        height: 300,
                        foreColor: '#fff',
                        fontFamily: 'inherit'
                    },
                    series: data.type_breakdown.series,
                    labels: data.type_breakdown.labels,
                    legend: {
                        position: 'bottom',
                        labels: { colors: '#fff' }
                    },
                    dataLabels: {
                        style: {
                            colors: ['#fff']
                        }
                    },
                    tooltip: {
                        theme: 'dark'
                    }
                };

                if (invChart) {
                    invChart.updateOptions(chartOptions);
                } else {
                    invChart = new ApexCharts(document.querySelector("#inv-type-chart"), chartOptions);
                    invChart.render();
                }
            };

            const fetchData = async () => {
                try {
                    // ✅ highlight: เปลี่ยนมาใช้ fetchWithAuth เพื่อความปลอดภัยและเสถียรภาพ
                    const response = await fetchWithAuth('/api/inventory-dashboard');
                    const result = await response.json();
                    if (result.success) {
                        renderDashboard(result.data);
                    } else { throw new Error(result.error); }
                } catch (err) {
                    console.error("Failed to load inventory dashboard:", err);
                    document.querySelector('.page-body .container-xl').innerHTML = `<div class="alert alert-danger">Failed to load data. Please check the console.</div>`;
                }
            };

            // --- ส่วนที่ 3: การเรียกใช้งานฟังก์ชันทั้งหมด ---
            loadSidebar();
            // ❌ highlight: ลบการเรียก loadUserInfo() ออก เพราะหน้านี้ไม่มีที่แสดงผล (id="display-username")
            fetchData();

        });
    </script>
</body>

</html>
