<!doctype html>
<html lang="th" data-bs-theme="dark">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>รายละเอียดใบส่งของ - Smart Factory</title>
    <link href="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/css/tabler.min.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #f0f2f5;
            font-family: 'Sarabun', sans-serif;
            margin: 0;
            padding: 0;
        }

        .page-body {
            display: flex;
            justify-content: center;
            padding: 2rem 0;
            margin: 0;
        }

        .a4-page {
            background: white;
            width: 21cm;
            min-height: 29.7cm;
            padding: 1.5cm;
            margin: 0 auto;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            color: #333;
            font-size: 10pt;
            position: relative;
        }

        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .items-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        .document-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px solid #dee2e6;
            padding-bottom: 1rem;
        }

        .company-details {
            text-align: right;
        }

        .document-meta {
            display: flex;
            justify-content: space-between;
            margin-top: 1.5rem;
        }

        .customer-box {
            border: 1px solid #ccc;
            padding: 0.75rem;
            width: 55%;
            min-height: 100px;
        }

        .document-info {
            width: 40%;
        }

        .document-info p {
            margin-bottom: 0.25rem;
        }

        .document-info strong {
            display: inline-block;
            min-width: 120px;
        }

        .document-title {
            text-align: center;
            margin: 1rem 0;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .items-table th,
        .items-table td {
            border: 1px solid #000;
            padding: 4px;
            text-align: left;
            vertical-align: middle;
        }

        .items-table thead {
            background-color: #f8f9fa;
        }

        .items-table th {
            font-weight: bold;
        }

        .items-table tr {
            min-height: 24px;
        }

        .text-center {
            text-align: center;
        }

        .document-footer {
            margin-top: auto;
            padding-top: 1rem;
        }

        .signature-section {
            display: flex;
            justify-content: space-around;
            text-align: center;
            margin-top: 1rem;
        }

        .signature-box {
            width: 30%;
        }

        .signature-box .line {
            border-bottom: 1px solid #333;
            margin: 2rem 0 0.5rem 0;
        }

        .page-number {
            display: none;
        }

        @media print {
            @page {
                size: A4;
                margin: 0.5cm;
            }

            html,
            body {
                margin: 0;
                padding: 0;
                width: 100%;
            }

            .page-wrapper,
            .page-body {
                padding: 0;
                margin: 0;
            }

            .page-header,
            .navbar {
                display: none !important;
            }

            .d-print-none {
                display: none !important;
            }

            .a4-page {
                box-shadow: none;
                margin: 0;
                width: 100%;
                min-height: initial;
                padding: 0;
                page-break-after: always;
            }

            .items-table thead {
                display: table-header-group;
                background-color: #f8f9fa !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            .items-table tbody tr {
                page-break-inside: avoid;
            }

            .items-table {
                page-break-inside: auto;
            }

            .document-footer {
                page-break-inside: avoid;
            }

            body {
                counter-reset: page;
            }

            .page-number {
                display: block;
                position: absolute;
                bottom: 10px;
                right: 20px;
                font-size: 9pt;
            }

            .page-number::after {
                counter-increment: page;
                content: "หน้า " counter(page);
            }
        }
    </style>
</head>

<body>
    <!-- Action Buttons for Screen Only -->
    <div class="d-print-none position-fixed top-0 end-0 p-3" style="z-index: 1000;">
        <a href="/delivery-orders.html" class="btn btn-outline-secondary">กลับ</a>
        <button type="button" class="btn btn-primary" onclick="window.print();">พิมพ์</button>
    </div>

    <div class="page-body" id="page-content-wrapper" style="margin: 0; padding: 0;">
        <!-- Content will be injected here -->
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const urlParams = new URLSearchParams(window.location.search);
            const doId = urlParams.get('id');

            if (!doId) {
                document.body.innerHTML = '<div class="container text-center mt-5"><h1>ไม่พบ ID</h1></div>';
                return;
            }

            const formatDate = (dateString) => {
                if (!dateString) return '-';
                const date = new Date(dateString);
                return date.toLocaleDateString('th-TH', { day: '2-digit', month: '2-digit', year: 'numeric' });
            };

            function createPageHTML(details, pageItems) {
                const headerHTML = `
                    <div class="document-header">
                        <div class="company-logo">
                            <img src="/uploads/items/espa-logo.png" alt="ES-PA Engineering Logo" style="max-width: 200px; height: auto;">
                        </div>
                        <div class="company-details">
                            <p style="font-size: 1.1rem; font-weight: bold; margin: 0;">บริษัท เอส ป้า เอ็นจิเนียริ่ง จำกัด</p>
                            99/2 หมู่ 2 ต.บ่อตาโล่ อ.วังน้อย จ.พระนครศรีอยุธยา 13170<br>
                            Tel: 089-1804303 เลขประจำตัวผู้เสียภาษีอากร 0135555011210
                        </div>
                    </div>
                    <div class="document-title">ใบส่งของ / DELIVERY ORDER</div>
                    <div class="document-meta">
                        <div class="customer-box">
                            <strong>ชื่อ/Name:</strong>
                            <div style="padding-left: 1rem; padding-top: 0.5rem;">
                                <strong>${details.customer_name || ''}</strong><br>
                                ${details.shipping_address || details.customer_address || ''}<br>
                                Tax ID: ${details.customer_tax_id || '-'}
                            </div>
                        </div>
                        <div class="document-info">
                             <p><strong>เลขที่/No:</strong> <span>${details.do_number}</span></p>
                             <p><strong>วันที่ส่ง/Delivery Date:</strong> <span>${formatDate(details.shipping_date)}</span></p>
                        </div>
                    </div>
                `;

                const tableHeaderHTML = `
                    <thead>
                        <tr>
                            <th class="text-center" style="width: 5%;">ลำดับ</th>
                            <th class="text-center" style="width: 15%;">รหัสสินค้า</th>
                            <th>รายการ</th>
                            <th class="text-center" style="width: 20%;">อ้างอิง PO</th>
                            <th class="text-center" style="width: 10%;">จำนวน</th>
                            <th class="text-center" style="width: 10%;">หน่วย</th>
                        </tr>
                    </thead>
                `;

                const ROWS_PER_PAGE = 17;
                let itemsHTML = pageItems.map((item) => `
                    <tr>
                        <td class="text-center">${item.originalIndex + 1}</td>
                        <td class="text-center">${item.item_code}</td>
                        <td>${item.item_name}</td>
                        <td class="text-center">${item.customer_po_number || '-'}</td>
                        <td class="text-center">${item.quantity_shipped.toLocaleString()}</td>
                        <td class="text-center">${item.uom || 'PCS'}</td>
                    </tr>
                `).join('');

                const emptyRowsNeeded = ROWS_PER_PAGE - pageItems.length;
                if (emptyRowsNeeded > 0) {
                    for (let i = 0; i < emptyRowsNeeded; i++) {
                        itemsHTML += '<tr><td>&nbsp;</td><td></td><td></td><td></td><td></td><td></td></tr>';
                    }
                }

                const footerHTML = `
                    <div class="document-footer">
                        <div class="signature-section">
                            <div class="signature-box"><div class="line"></div><p>ผู้อนุมัติ</p></div>
                            <div class="signature-box"><div class="line"></div><p>ผู้ส่งสินค้า</p></div>
                            <div class="signature-box"><div class="line"></div><p>ผู้รับสินค้า</p></div>
                        </div>
                    </div>
                `;

                return `
                    <div class="a4-page">
                        <div class="main-content">
                            ${headerHTML}
                            <table class="items-table">
                                ${tableHeaderHTML}
                                <tbody>${itemsHTML}</tbody>
                            </table>
                            ${footerHTML}
                        </div>
                        <div class="page-number"></div>
                    </div>
                `;
            }

            fetch(`/api/delivery-orders/${doId}`)
                .then(response => response.ok ? response.json() : Promise.reject('Network error'))
                .then(result => {
                    if (!result.data) throw new Error('Invalid response format');
                    const { details, items } = result.data;

                    document.title = `DO ${details.do_number} - Smart Factory`;

                    const pageWrapper = document.getElementById('page-content-wrapper');
                    pageWrapper.innerHTML = '';

                    const ROWS_PER_PAGE = 17;
                    const itemsWithIndex = items.map((item, index) => ({ ...item, originalIndex: index }));

                    for (let i = 0; i < itemsWithIndex.length; i += ROWS_PER_PAGE) {
                        const pageItems = itemsWithIndex.slice(i, i + ROWS_PER_PAGE);
                        pageWrapper.innerHTML += createPageHTML(details, pageItems);
                    }
                })
                .catch(error => {
                    console.error('Error fetching DO details:', error);
                    document.getElementById('page-content-wrapper').innerHTML = '<div class="a4-page"><p class="text-danger text-center">เกิดข้อผิดพลาดในการโหลดข้อมูล</p></div>';
                });
        });
    </script>
</body>

</html>
