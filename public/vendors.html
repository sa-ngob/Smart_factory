<!doctype html>
<html lang="th" data-bs-theme="dark">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>จัดการผู้ขาย - Smart Factory</title>
    <link href="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/css/tabler.min.css" rel="stylesheet" />
    <style>
        /* CSS สำหรับซ่อน/แสดงปุ่มตาม Role */
        .admin-only {
            display: none !important;
        }

        body.role-admin .admin-only {
            display: inline-flex !important;
        }
    </style>
</head>

<body>
    <div class="page">
        <aside class="navbar navbar-vertical navbar-expand-lg" data-bs-theme="dark" id="sidebar"></aside>

        <div class="page-wrapper">
            <div class="page-header d-print-none">
                <div class="container-xl">
                    <p>
                        Logged in as: <strong id="display-username">Loading...</strong>
                    </p>
                    <h2 class="page-title">จัดการข้อมูลผู้ขาย (Vendor)</h2>
                </div>
            </div>
            <div class="page-body">
                <div class="container-xl">
                    <div class="row g-4">
                        <div class="col-lg-4">
                            <form id="entity-form" class="card">
                                <div class="card-header">
                                    <h3 class="card-title">เพิ่ม / แก้ไขข้อมูล</h3>
                                </div>
                                <div class="card-body">

                                    <input type="hidden" id="entity-id" name="id">

                                    <div class="mb-3">
                                        <label class="form-label">ประเภท</label>
                                        <div class="d-flex gap-3">
                                            <label class="form-check">
                                                <input class="form-check-input" type="checkbox" name="is_customer"
                                                    id="is_customer_checkbox">
                                                <span class="form-check-label">เป็นลูกค้า</span>
                                            </label>
                                            <label class="form-check">
                                                <input class="form-check-input" type="checkbox" name="is_vendor"
                                                    id="is_vendor_checkbox" checked>
                                                <span class="form-check-label">เป็นผู้ขาย</span>
                                            </label>
                                        </div>
                                    </div>

                                    <div class="mb-3"><label class="form-label">รหัส</label><input type="text"
                                            id="entity_code" name="entity_code" class="form-control" readonly></div>
                                    <div class="mb-3"><label class="form-label required">ชื่อบริษัท/ผู้ขาย</label><input
                                            type="text" name="name" class="form-control" required></div>
                                    <div class="mb-3"><label class="form-label">เลขประจำตัวผู้เสียภาษี</label><input
                                            type="text" name="tax_id" class="form-control"></div>
                                    <div class="mb-3"><label class="form-label">ที่อยู่</label><textarea name="address"
                                            rows="3" class="form-control"></textarea></div>

                                    <div class="mb-3">
                                        <div class="form-label">ที่ตั้งสำนักงาน</div>
                                        <div class="d-flex gap-3">
                                            <label class="form-check">
                                                <input class="form-check-input" type="radio" name="location_type"
                                                    value="head_office" checked id="radio_head_office">
                                                <span class="form-check-label">สำนักงานใหญ่</span>
                                            </label>
                                            <label class="form-check">
                                                <input class="form-check-input" type="radio" name="location_type"
                                                    value="branch" id="radio_branch">
                                                <span class="form-check-label">สาขา</span>
                                            </label>
                                        </div>
                                    </div>

                                    <div class="row" id="branch_details" style="display: none;">
                                        <div class="col-6 mb-3"><label class="form-label">รหัสสาขา</label><input
                                                type="text" name="branch_code" class="form-control"
                                                id="input_branch_code"></div>
                                        <div class="col-6 mb-3"><label class="form-label">ชื่อสาขา</label><input
                                                type="text" name="branch_name" class="form-control"
                                                id="input_branch_name"></div>
                                    </div>
                                    <div class="mb-3"><label class="form-label">ผู้ติดต่อ</label><input type="text"
                                            name="contact_person" class="form-control"></div>
                                    <div class="mb-3"><label class="form-label">อีเมล</label><input type="email"
                                            name="email" class="form-control"></div>
                                    <div class="mb-3"><label class="form-label">เบอร์โทร</label><input type="tel"
                                            name="phone" class="form-control"></div>
                                </div>
                                <div class="card-footer text-end">
                                    <button type="button" id="btn-clear" class="btn">ล้างฟอร์ม</button>
                                    <button type="submit" class="btn btn-primary">บันทึกข้อมูล</button>
                                </div>
                            </form>
                        </div>
                        <div class="col-lg-8">
                            <div class="card">
                                <div class="table-responsive">
                                    <table class="table table-vcenter card-table">
                                        <thead>
                                            <tr>
                                                <th>รหัส</th>
                                                <th>ชื่อผู้ขาย</th>
                                                <th>ผู้ติดต่อ</th>
                                                <th>เบอร์โทร</th>
                                                <th>ประเภท</th>
                                                <th class="w-1"></th>
                                            </tr>
                                        </thead>
                                        <tbody id="entity-table-body"></tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/js/tabler.min.js" defer></script>
    <script>
        async function setupUserRole() {
            try {
                const response = await fetch('/auth/me');
                if (response.ok) {
                    const user = await response.json();
                    document.body.classList.add(`role-${user.role}`);
                } else { window.location.href = '/login.html'; }
            } catch (error) { window.location.href = '/login.html'; }
        }

        document.addEventListener('DOMContentLoaded', async function () {
            await setupUserRole();

            // Load Sidebar
            fetch('api/sidebar').then(res => res.text()).then(data => {
                document.getElementById('sidebar').innerHTML = data;
                const link = document.querySelector('a.nav-link[href="/vendors.html"]');
                if (link) link.parentElement.classList.add('active');
            });

            const form = document.getElementById('entity-form');
            const tableBody = document.getElementById('entity-table-body');
            const entityIdInput = document.getElementById('entity-id');
            const entityCodeInput = document.getElementById('entity_code');
            const isCustomerCheckbox = document.getElementById('is_customer_checkbox');
            const isVendorCheckbox = document.getElementById('is_vendor_checkbox');
            const btnClear = document.getElementById('btn-clear');

            const radioHeadOffice = document.getElementById('radio_head_office');
            const radioBranch = document.getElementById('radio_branch');
            const branchDetails = document.getElementById('branch_details');
            const inputBranchCode = document.getElementById('input_branch_code');
            const inputBranchName = document.getElementById('input_branch_name');

            function toggleBranchDetails() {
                if (radioBranch.checked) {
                    branchDetails.style.display = 'flex';
                } else {
                    branchDetails.style.display = 'none';
                    if (!this.blockClear) { // Check if we should block clearing (during edit load)
                        inputBranchCode.value = '';
                        inputBranchName.value = '';
                    }
                }
            }

            radioHeadOffice.addEventListener('change', toggleBranchDetails);
            radioBranch.addEventListener('change', toggleBranchDetails);

            const LIST_TYPE = 'vendor';

            async function loadNextCode() {
                try {
                    const response = await fetch(`/api/entities/next-code?list_for=${LIST_TYPE}`);
                    const data = await response.json();
                    entityCodeInput.value = data.entity_code;
                } catch (error) { console.error('Failed to load next code:', error); }
            }

            async function loadEntities() {
                try {
                    const response = await fetch(`/api/entities?list_for=${LIST_TYPE}`);
                    const result = await response.json();
                    tableBody.innerHTML = '';
                    result.data.forEach(entity => {
                        const row = document.createElement('tr');
                        let roles = [];
                        if (entity.is_customer) roles.push('<span class="badge bg-blue-lt">ลูกค้า</span>');
                        if (entity.is_vendor) roles.push('<span class="badge bg-green-lt">ผู้ขาย</span>');

                        row.innerHTML = `
                            <td>${entity.entity_code || ''}</td>
                            <td>${entity.name}</td>
                            <td>${entity.contact_person || ''}</td>
                            <td>${entity.phone || ''}</td>
                            <td>${roles.join(' ')}</td>
                            <td class="text-end">
                                <div class="btn-list flex-nowrap">
                                    <a href="#" class="btn btn-sm btn-edit" data-id="${entity.id}">แก้ไข</a>
                                    <div class="admin-only"><a href="#" class="btn btn-sm btn-danger btn-delete" data-id="${entity.id}">ลบ</a></div>
                                </div>
                            </td>
                        `;
                        row.querySelector('.btn-edit').dataset.entity = JSON.stringify(entity);
                        tableBody.appendChild(row);
                    });
                } catch (error) { console.error('Failed to load data:', error); }
            }

            function clearForm() {
                form.reset();
                entityIdInput.value = '';
                isCustomerCheckbox.checked = false;
                isVendorCheckbox.checked = true;

                radioHeadOffice.checked = true;
                toggleBranchDetails();

                loadNextCode();
            }

            form.addEventListener('submit', async function (e) {
                e.preventDefault();
                const formData = new FormData(form);
                const data = Object.fromEntries(formData.entries());

                data.is_customer = isCustomerCheckbox.checked ? 1 : 0;
                data.is_vendor = isVendorCheckbox.checked ? 1 : 0;

                const entityId = entityIdInput.value;
                const url = entityId ? `/api/entities/${entityId}` : '/api/entities';
                const method = entityId ? 'PUT' : 'POST';

                fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                }).then(response => {
                    if (response.ok) {
                        alert('บันทึกข้อมูลสำเร็จ!');
                        clearForm();
                        loadEntities();
                    } else {
                        alert('เกิดข้อผิดพลาดในการบันทึกข้อมูล');
                    }
                });
            });

            tableBody.addEventListener('click', function (e) {
                if (e.target.classList.contains('btn-edit')) {
                    e.preventDefault();
                    const entityData = JSON.parse(e.target.dataset.entity);

                    Object.keys(entityData).forEach(key => {
                        const input = form.elements[key];
                        if (input && input.type !== 'checkbox') input.value = entityData[key];
                    });

                    isCustomerCheckbox.checked = !!entityData.is_customer;
                    isVendorCheckbox.checked = !!entityData.is_vendor;

                    if (entityData.branch_code || entityData.branch_name) {
                        radioBranch.checked = true;
                    } else {
                        radioHeadOffice.checked = true;
                    }
                    toggleBranchDetails.call({ blockClear: true }); // Prevent clearing values during load

                    entityIdInput.value = entityData.id;
                    window.scrollTo(0, 0);
                }
                if (e.target.classList.contains('btn-delete')) {
                    e.preventDefault();
                    if (confirm('คุณต้องการลบข้อมูลนี้ใช่หรือไม่?')) {
                        const entityId = e.target.dataset.id;
                        fetch(`/api/entities/${entityId}`, { method: 'DELETE' })
                            .then(response => {
                                if (response.ok) { alert('ลบข้อมูลสำเร็จ'); loadEntities(); }
                                else { alert('เกิดข้อผิดพลาดในการลบ'); }
                            });
                    }
                }
            });

            btnClear.addEventListener('click', clearForm);

            clearForm();
            loadEntities();
        });
    </script>
</body>

</html>
