<!doctype html>
<html lang="th" data-bs-theme="dark">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Production Dashboard (Real-time)</title>
    <link href="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/css/tabler.min.css" rel="stylesheet" />
    <style>
        .avatar {
            width: 2.5rem;
            height: 2.5rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: .375rem;
        }
    </style>
</head>

<body>
    <div class="page">
        <aside class="navbar navbar-vertical navbar-expand-lg" data-bs-theme="dark" id="sidebar"></aside>
        <div class="page-wrapper">
            <div class="page-header">
                <div class="container-xl">
                    <h2 class="page-title">Production Dashboard (Live DB)</h2>
                </div>
            </div>
            <div class="page-body">
                <div class="container-xl">
                    <div class="row row-cards">
                        <div class="col-sm-6 col-lg-3">
                            <div class="card card-sm">
                                <div class="card-body">
                                    <div class="row align-items-center">
                                        <div class="col-auto"><span class="bg-blue text-white avatar"><svg
                                                    xmlns="http://www.w3.org/2000/svg" class="icon" width="24"
                                                    height="24" viewBox="0 0 24 24" stroke-width="2"
                                                    stroke="currentColor" fill="none" stroke-linecap="round"
                                                    stroke-linejoin="round">
                                                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                                                    <path
                                                        d="M16 6h3a1 1 0 0 1 1 1v11a1 1 0 0 1 -1 1h-14a1 1 0 0 1 -1 -1v-11a1 1 0 0 1 1 -1h3" />
                                                    <path d="M10 16v-10" />
                                                    <path d="M10 6l4 4" />
                                                    <path d="M10 6l-4 4" />
                                                </svg></span></div>
                                        <div class="col">
                                            <div class="font-weight-medium" id="kpi-total-machines">0</div>
                                            <div class="text-secondary">Total Machines</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-sm-6 col-lg-3">
                            <div class="card card-sm">
                                <div class="card-body">
                                    <div class="row align-items-center">
                                        <div class="col-auto"><span class="bg-green text-white avatar"><svg
                                                    xmlns="http://www.w3.org/2000/svg" class="icon" width="24"
                                                    height="24" viewBox="0 0 24 24" stroke-width="2"
                                                    stroke="currentColor" fill="none" stroke-linecap="round"
                                                    stroke-linejoin="round">
                                                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                                                    <path d="M7 4v16l13 -8z" />
                                                </svg></span></div>
                                        <div class="col">
                                            <div class="font-weight-medium" id="kpi-running-machines">0</div>
                                            <div class="text-secondary">Running</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-sm-6 col-lg-3">
                            <div class="card card-sm">
                                <div class="card-body">
                                    <div class="row align-items-center">
                                        <div class="col-auto"><span class="bg-yellow text-white avatar"><svg
                                                    xmlns="http://www.w3.org/2000/svg" class="icon" width="24"
                                                    height="24" viewBox="0 0 24 24" stroke-width="2"
                                                    stroke="currentColor" fill="none" stroke-linecap="round"
                                                    stroke-linejoin="round">
                                                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                                                    <path
                                                        d="M6 5m0 1a1 1 0 0 1 1 -1h2a1 1 0 0 1 1 1v12a1 1 0 0 1 -1 1h-2a1 1 0 0 1 -1 -1z" />
                                                    <path
                                                        d="M14 5m0 1a1 1 0 0 1 1 -1h2a1 1 0 0 1 1 1v12a1 1 0 0 1 -1 1h-2a1 1 0 0 1 -1 -1z" />
                                                </svg></span></div>
                                        <div class="col">
                                            <div class="font-weight-medium" id="kpi-stop-machines">0</div>
                                            <div class="text-secondary">Stop / Idle</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-sm-6 col-lg-3">
                            <div class="card card-sm">
                                <div class="card-body">
                                    <div class="row align-items-center">
                                        <div class="col-auto"><span class="bg-red text-white avatar"><svg
                                                    xmlns="http://www.w3.org/2000/svg" class="icon" width="24"
                                                    height="24" viewBox="0 0 24 24" stroke-width="2"
                                                    stroke="currentColor" fill="none" stroke-linecap="round"
                                                    stroke-linejoin="round">
                                                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                                                    <path d="M12 9v4" />
                                                    <path
                                                        d="M10.363 3.591l-8.106 13.534a1.914 1.914 0 0 0 1.636 2.871h16.214a1.914 1.914 0 0 0 1.636 -2.87l-8.106 -13.536a1.914 1.914 0 0 0 -3.274 0z" />
                                                    <path d="M12 16h.01" />
                                                </svg></span></div>
                                        <div class="col">
                                            <div class="font-weight-medium" id="kpi-alarm-machines">0</div>
                                            <div class="text-secondary">Alarm</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="card mt-4">
                        <div class="table-responsive">
                            <table class="table table-vcenter card-table table-striped">
                                <thead>
                                    <tr>
                                        <th>Machine</th>
                                        <th>Status</th>
                                        <th>MO Number</th>
                                        <th>Item Name</th>
                                        <th>Mold Count</th>
                                        <th>Cycle Time</th>
                                        <th>Dry Temp</th>
                                        <th>Core Temp</th>
                                        <th>Cavity Temp</th>
                                        <th>Last Update</th>
                                    </tr>
                                </thead>
                                <tbody id="machine-table-body">
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="/js/auth-client.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {

            /**
             * ฟังก์ชันสำหรับแปลงเวลา GMT/UTC ให้เป็นเวลาท้องถิ่น
             */
            const convertToLocalTime = (gmtTimestamp) => {
                if (!gmtTimestamp || gmtTimestamp.includes("None")) return 'N/A';
                const date = new Date(gmtTimestamp);
                const options = { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false, timeZone: 'Asia/Bangkok' };
                return new Intl.DateTimeFormat('th-TH', options).format(date);
            };

            /**
             * ฟังก์ชันสำหรับแปลง Status ID เป็นข้อความและสี
             */
            const getStatusInfo = (statusId) => {
                switch (statusId) {
                    case 0: return { text: "Stop", class: "bg-yellow" };
                    case 1: return { text: "Running", class: "bg-green" };
                    case 2: return { text: "Alarm", class: "bg-red" };
                    default: return { text: "Unknown", class: "bg-secondary" };
                }
            };

            /**
             * ฟังก์ชันสำหรับแสดงผล KPI (เวอร์ชันแก้ไข)
             */
            const renderDashboard = (data) => {
                // ✅ FIX: แก้ไขชื่อ property ให้ตรงกับ API (snake_case)
                document.getElementById('kpi-total-machines').innerText = data.kpis.total_machines;
                document.getElementById('kpi-running-machines').innerText = data.kpis.running;
                document.getElementById('kpi-stop-machines').innerText = data.kpis.stop;
                document.getElementById('kpi-alarm-machines').innerText = data.kpis.alarm;

                // ✅ FIX: แก้ไขชื่อ property ให้ตรงกับ API (snake_case)
                renderMachineList(data.machine_list);
            };

            /**
             * ฟังก์ชันสำหรับวาดตารางข้อมูลเครื่องจักร
             */
            const renderMachineList = (machines) => {
                const machineTableBody = document.getElementById('machine-table-body');
                if (!machines || machines.length === 0) {
                    machineTableBody.innerHTML = '<tr><td colspan="10" class="text-center">No machine data available</td></tr>';
                    return;
                }

                machineTableBody.innerHTML = machines.map(m => {
                    const status = getStatusInfo(m.machine_status);

                    // (ส่วนนี้ถูกต้องอยู่แล้ว จากการแก้ไขครั้งก่อน)
                    const moNumber = m.mo_number || 'N/A';
                    const itemName = m.item_name || 'N/A';
                    const moldCount = (m.mold_count !== null && m.mold_count !== undefined) ? m.mold_count : 'N/A';
                    const cycleTime = (m.cycle_time !== null && m.cycle_time !== undefined) ? m.cycle_time + ' s' : 'N/A';
                    const dryTemp = (m.material_dry_temp !== null && m.material_dry_temp !== undefined) ? m.material_dry_temp + ' °C' : 'N/A';
                    const coreTemp = (m.mold_temp_core !== null && m.mold_temp_core !== undefined) ? m.mold_temp_core + ' °C' : 'N/A';
                    const cavityTemp = (m.mold_temp_cavity !== null && m.mold_temp_cavity !== undefined) ? m.mold_temp_cavity + ' °C' : 'N/A';
                    const lastUpdate = convertToLocalTime(m.timestamp);

                    return `
                    <tr>
                        <td><span class="text-muted">${m.machine_id}</span></td>
                        <td><span class="badge ${status.class} me-1"></span> ${status.text}</td>
                        <td>${moNumber}</td>
                        <td>${itemName}</td>
                        <td>${moldCount}</td>
                        <td>${cycleTime}</td>
                        <td>${dryTemp}</td>
                        <td>${coreTemp}</td>
                        <td>${cavityTemp}</td>
                        <td>${lastUpdate}</td>
                    </tr>
                `;
                }).join('');
            };

            const fetchData = async () => {
                try {
                    const response = await fetchWithAuth('/api/dashboard/production-data?t=' + new Date().getTime());
                    const result = await response.json();
                    if (result.success) {
                        console.log("Dashboard Data:", result.data); // Debug log
                        renderDashboard(result.data);
                    } else { throw new Error(result.error); }
                } catch (err) {
                    console.error("Failed to load production dashboard:", err);
                }
            };

            // --- เรียกใช้งานฟังก์ชันทั้งหมดเมื่อหน้าเว็บโหลดเสร็จ ---
            loadSidebar();

            fetchData();
            setInterval(fetchData, 5000); // Refresh ทุก 5 วินาที
        });
    </script>
</body>

</html>
