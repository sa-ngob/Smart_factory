<!doctype html>
<html lang="th" data-bs-theme="dark">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>รายการใบส่งของ - Smart Factory</title>
    <link href="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/css/tabler.min.css" rel="stylesheet" />
    <style>
        .modal-body .table-responsive {
            max-height: 300px;
        }
    </style>
</head>

<body>
    <div class="page">
        <aside class="navbar navbar-vertical navbar-expand-lg" data-bs-theme="dark" id="sidebar-container">
            <div class="text-center p-4 text-white">กำลังโหลดเมนู...</div>
        </aside>

        <div class="page-wrapper">
            <div class="page-header d-print-none">
                <div class="container-xl">
                    <p>
                        Logged in as: <strong id="display-username">Loading...</strong>
                    </p>
                    <div class="row g-2 align-items-center">
                        <div class="col">
                            <h2 class="page-title">รายการใบส่งของ (Delivery Orders)</h2>
                        </div>
                        <div class="col-auto ms-auto d-print-none">
                            <a href="#" class="btn btn-primary" data-bs-toggle="modal"
                                data-bs-target="#modal-create-do">
                                สร้างใบส่งของใหม่
                            </a>
                        </div>
                    </div>
                </div>
            </div>
            <div class="page-body">
                <div class="container-xl">
                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">ประวัติการส่งของทั้งหมด</h3>
                        </div>
                        <div class="card-body border-bottom py-3">
                            <div class="d-flex">
                                <div class="text-muted">
                                    แสดง
                                    <div class="mx-2 d-inline-block">
                                        <input type="text" class="form-control form-control-sm" value="10" size="3"
                                            aria-label="Invoices count" disabled>
                                    </div>
                                    รายการ
                                </div>
                                <div class="ms-auto text-muted">
                                    ค้นหา:
                                    <div class="ms-2 d-inline-block">
                                        <input type="text" id="searchInput" class="form-control form-control-sm"
                                            aria-label="Search invoice">
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="table-responsive">
                            <table class="table card-table table-vcenter text-nowrap">
                                <thead>
                                    <tr>
                                        <th>เลขที่ใบส่งของ</th>
                                        <th>อ้างอิง SO</th>
                                        <th>ลูกค้า</th>
                                        <th>วันที่ส่ง</th>
                                        <th>สถานะ</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody id="do-table-body"></tbody>
                            </table>
                        </div>
                        <div class="card-footer d-flex align-items-center">
                            <p class="m-0 text-muted" id="pagination-info">แสดง <span>0</span> ถึง <span>0</span> จาก
                                <span>0</span> รายการ</p>
                            <ul class="pagination m-0 ms-auto">
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal modal-blur fade" id="modal-create-do" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">สร้างใบส่งของใหม่</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">เลือกจากใบสั่งขาย (Sales Order)</label>
                        <select class="form-select" id="select-so">
                            <option value="">-- กรุณาเลือกใบสั่งขาย --</option>
                        </select>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">วันที่ส่งของ</label>
                            <input type="date" class="form-control" id="shipping-date">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">เลขที่ PO ลูกค้า (อ้างอิง)</label>
                            <input type="text" class="form-control" id="customer-po-ref" readonly>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">ที่อยู่จัดส่ง</label>
                        <textarea class="form-control" id="shipping-address" rows="3"></textarea>
                    </div>
                    <hr>
                    <h5>รายการสินค้าสำหรับจัดส่ง</h5>
                    <div class="table-responsive">
                        <table class="table table-sm">
                            <thead>
                                <tr>
                                    <th>สินค้า</th>
                                    <th class="text-center">ค้างส่ง</th>
                                    <th class="text-center" style="width: 120px;">จำนวนที่จะส่ง</th>
                                </tr>
                            </thead>
                            <tbody id="do-items-table"></tbody>
                        </table>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn me-auto" data-bs-dismiss="modal">ยกเลิก</button>
                    <button type="button" class="btn btn-primary" id="save-do-btn">บันทึกใบส่งของ</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/js/tabler.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/js/tabler.min.js" defer></script>

    <script src="/js/auth-client.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // ตอนนี้สามารถเรียกใช้ fetchWithAuth() ได้เลย

            async function loadSidebar() {
                try {
                    // ใช้ฟังก์ชันจากไฟล์กลางเพื่อเรียก API
                    const response = await fetchWithAuth('/api/sidebar');
                    const sidebarHtml = await response.text();
                    document.getElementById('sidebar-container').innerHTML = sidebarHtml;
                } catch (error) {
                    console.error("Could not load sidebar:", error.message);
                }
            }

            async function loadUserInfo() {
                try {
                    const response = await fetchWithAuth('/api/user-info');
                    const data = await response.json();

                    if (data.success && data.displayName) {
                        document.getElementById('display-username').textContent = data.displayName;
                    }
                } catch (error) {
                    console.error("Could not load user info:", error.message);
                }
            }

            // เรียกใช้งานฟังก์ชันทั้งหมดที่หน้านี้ต้องการ
            loadSidebar();
            loadUserInfo();
            // หากหน้านี้ต้องโหลดข้อมูลอื่นอีก ก็เรียกฟังก์ชันเพิ่มตรงนี้
        });
    </script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const formatDate = (dateString) => dateString ? new Date(dateString).toLocaleDateString('th-TH') : '-';
            const formatStatus = (status) => `<span class="badge bg-secondary-lt">${status}</span>`;
            let allDeliveryOrders = []; // Store all data for filtering

            async function fetchDeliveryOrders() {
                const tableBody = document.getElementById('do-table-body');
                tableBody.innerHTML = '<tr><td colspan="6" class="text-center">กำลังโหลด...</td></tr>';
                try {
                    const response = await fetch('/api/delivery-orders');
                    const result = await response.json();
                    if (!response.ok) throw new Error(result.error);

                    allDeliveryOrders = result.data || [];
                    renderTable(allDeliveryOrders);

                } catch (error) {
                    tableBody.innerHTML = `<tr><td colspan="6" class="text-center text-danger">${error.message}</td></tr>`;
                }
            }

            function renderTable(data) {
                const tableBody = document.getElementById('do-table-body');
                if (!data || data.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="6" class="text-center">ไม่พบข้อมูล</td></tr>';
                    updatePaginationInfo(0);
                    return;
                }
                tableBody.innerHTML = data.map(doItem => `
                    <tr>
                        <td><a href="/delivery-order-detail.html?id=${doItem.id}">${doItem.do_number}</a></td>
                        <td>${doItem.so_number || '-'}</td>
                        <td>${doItem.customer_name}</td>
                        <td>${formatDate(doItem.shipping_date)}</td>
                        <td><span class="badge bg-secondary-lt">${doItem.status}</span></td>
                        <td class="text-end"><a href="/delivery-order-detail.html?id=${doItem.id}" class="btn btn-sm">ดูรายละเอียด</a></td>
                    </tr>
                `).join('');
                updatePaginationInfo(data.length);
            }

            function updatePaginationInfo(count) {
                const totalCount = allDeliveryOrders.length;
                document.querySelector('#pagination-info span:first-child').textContent = count > 0 ? '1' : '0';
                document.querySelector('#pagination-info span:nth-child(2)').textContent = count;
                document.querySelector('#pagination-info span:last-child').textContent = totalCount;
            }


            async function populateSalesOrdersDropdown() {
                const select = document.getElementById('select-so');
                select.innerHTML = '<option>กำลังโหลด...</option>';
                try {
                    const response = await fetch('/api/sales-orders/for-delivery');
                    if (!response.ok) throw new Error((await response.json()).error);
                    const result = await response.json();
                    select.innerHTML = '<option value="">-- กรุณาเลือกใบสั่งขาย --</option>';
                    result.data.forEach(so => {
                        const option = document.createElement('option');
                        option.value = so.id;
                        option.textContent = `${so.so_number} - ${so.customer_name}`;
                        option.dataset.customerPo = so.customer_po_number;
                        option.dataset.customerAddress = so.customer_address;
                        option.dataset.customerId = so.customer_id; // <-- Important data from corrected API
                        select.appendChild(option);
                    });
                } catch (error) {
                    select.innerHTML = `<option>เกิดข้อผิดพลาด: ${error.message}</option>`;
                }
            }

            // --- Initial Load ---
            // fetch('api/sidebar').then(res => res.text()).then(data => document.getElementById('sidebar-container').innerHTML = data);
            fetchDeliveryOrders();

            // --- Modal Logic ---
            const createDoModalEl = document.getElementById('modal-create-do');
            createDoModalEl.addEventListener('show.bs.modal', function () {
                document.getElementById('select-so').value = '';
                document.getElementById('do-items-table').innerHTML = '<tr><td colspan="3" class="text-center text-muted">กรุณาเลือกใบสั่งขาย</td></tr>';
                document.getElementById('shipping-date').valueAsDate = new Date();
                document.getElementById('customer-po-ref').value = '';
                document.getElementById('shipping-address').value = '';
                populateSalesOrdersDropdown();
            });

            document.getElementById('select-so').addEventListener('change', async function () {
                const soId = this.value;
                const itemsTable = document.getElementById('do-items-table');
                const selectedOption = this.options[this.selectedIndex];

                if (!soId) {
                    itemsTable.innerHTML = '<tr><td colspan="3" class="text-center text-muted">กรุณาเลือกใบสั่งขาย</td></tr>';
                    return;
                }

                document.getElementById('customer-po-ref').value = selectedOption.dataset.customerPo || '';
                document.getElementById('shipping-address').value = selectedOption.dataset.customerAddress || '';
                itemsTable.innerHTML = '<tr><td colspan="3" class="text-center">กำลังโหลด...</td></tr>';

                try {
                    const response = await fetch(`/api/sales-orders/${soId}/delivery-items`);
                    if (!response.ok) throw new Error((await response.json()).error);
                    const result = await response.json();
                    const items = result.data;
                    if (items.length === 0) {
                        itemsTable.innerHTML = '<tr><td colspan="3" class="text-center">ไม่พบรายการค้างส่ง</td></tr>';
                        return;
                    }
                    itemsTable.innerHTML = items.map(item => `
                        <tr data-item-code="${item.item_code}" data-so-item-id="${item.sales_order_item_id}">
                            <td>${item.item_name} (${item.item_code})</td>
                            <td class="text-center">${item.quantity_ordered - item.quantity_shipped}</td>
                            <td><input type="number" class="form-control form-control-sm quantity-to-ship" value="${item.quantity_ordered - item.quantity_shipped}" min="0" max="${item.quantity_ordered - item.quantity_shipped}"></td>
                        </tr>
                    `).join('');
                } catch (error) {
                    itemsTable.innerHTML = `<tr><td colspan="3" class="text-center text-danger">${error.message}</td></tr>`;
                }
            });

            // --- Form Submission ---
            document.getElementById('save-do-btn').addEventListener('click', async function () {
                const soSelect = document.getElementById('select-so');
                const soId = soSelect.value;
                const selectedOption = soSelect.options[soSelect.selectedIndex];
                const customerId = selectedOption.dataset.customerId; // <-- Get the corrected customerId
                const shippingDate = document.getElementById('shipping-date').value;

                if (!soId || !shippingDate || !customerId) {
                    alert('กรุณาเลือกใบสั่งขายและวันที่ส่งของให้ครบถ้วน');
                    return;
                }

                const items = [];
                document.querySelectorAll('#do-items-table tr').forEach(row => {
                    const quantityInput = row.querySelector('.quantity-to-ship');
                    if (quantityInput && parseInt(quantityInput.value, 10) > 0) {
                        items.push({
                            so_item_id: row.dataset.soItemId,
                            item_code: row.dataset.itemCode,
                            quantity_shipped: parseInt(quantityInput.value, 10)
                        });
                    }
                });

                if (items.length === 0) {
                    alert('กรุณาระบุจำนวนสินค้าที่ต้องการส่งอย่างน้อย 1 รายการ');
                    return;
                }

                this.disabled = true;
                this.innerHTML = '<span class="spinner-border spinner-border-sm"></span> กำลังบันทึก...';

                try {
                    const response = await fetch('/api/delivery-orders', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            so_id: soId,
                            customer_id: customerId,
                            shipping_date: shippingDate,
                            items: items
                        })
                    });
                    const result = await response.json();
                    if (!response.ok) throw new Error(result.error);

                    alert('สร้างใบส่งของสำเร็จ!');
                    const modal = bootstrap.Modal.getInstance(createDoModalEl);
                    if (modal) modal.hide();

                    fetchDeliveryOrders();

                } catch (error) {
                    alert(`เกิดข้อผิดพลาด: ${error.message}`);
                } finally {
                    this.disabled = false;
                    this.innerHTML = 'บันทึกใบส่งของ';
                }
                location.reload();
            });

            // --- Search Functionality ---
            document.getElementById('searchInput').addEventListener('keyup', function () {
                const filter = this.value.toUpperCase();
                const filteredData = allDeliveryOrders.filter(row => {
                    const textValue = Object.values(row).join(' ').toUpperCase();
                    return textValue.indexOf(filter) > -1;
                });
                renderTable(filteredData);
            });

        });
    </script>
</body>

</html>
