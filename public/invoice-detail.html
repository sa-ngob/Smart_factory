<!doctype html>
<html lang="th" data-bs-theme="dark">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>รายละเอียดใบแจ้งหนี้ - Smart Factory</title>
    <link href="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/css/tabler.min.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #f0f2f5;
            font-family: 'Sarabun', sans-serif;
        }

        .page-body {
            display: flex;
            justify-content: center;
            padding: 2rem 0;
        }

        /* Fixed "Back" and "Print" buttons */
        .fixed-actions {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            gap: 10px;
        }

        .a4-page {
            background: white;
            width: 21cm;
            min-height: 29.7cm;
            padding: 1.5cm;
            margin: 0 auto;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            color: #333;
            font-size: 10pt;
            position: relative;
        }

        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .items-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        .document-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px solid #dee2e6;
            padding-bottom: 1rem;
        }

        .company-details {
            text-align: right;
        }

        .document-meta {
            display: flex;
            justify-content: space-between;
            margin-top: 1.5rem;
        }

        .customer-box {
            border: 1px solid #ccc;
            padding: 0.75rem;
            width: 55%;
            min-height: 100px;
        }

        .document-info {
            width: 40%;
        }

        .document-info p {
            margin-bottom: 0.25rem;
        }

        .document-info strong {
            display: inline-block;
            min-width: 120px;
        }

        .document-title {
            text-align: center;
            margin: 1.5rem 0;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .items-table th,
        .items-table td {
            border: 1px solid #000;
            padding: 3px 6px;
            text-align: left;
            vertical-align: middle;
            font-size: 10pt;
        }

        .items-table thead {
            background-color: #f8f9fa;
        }

        .items-table th {
            font-weight: bold;
        }

        .items-table tr {
            min-height: 24px;
        }

        .text-center {
            text-align: center;
        }

        .text-right {
            text-align: right;
        }

        .document-footer {
            margin-top: auto;
            padding-top: 1rem;
        }

        .summary-table {
            width: 60%;
            margin-left: auto;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        .summary-table td {
            border: none;
            padding: 2px 8px;
        }

        .signature-section {
            display: flex;
            justify-content: space-between;
            text-align: center;
            margin-top: 1.5rem;
            border-spacing: 10px;
            border-collapse: separate;
        }

        .signature-box {
            width: 33%;
            border: 1px solid #ccc;
            padding: 0.5rem;
        }

        .signature-line {
            height: 30px;
            border-bottom: 1px dotted #000;
            margin: 1.5rem 1rem 0.5rem 1rem;
        }

        .page-number {
            display: none;
        }

        @media print {
            @page {
                size: A4;
                margin: 0.5cm;
            }

            html,
            body {
                margin: 0;
                padding: 0;
                width: 100%;
                background-color: white;
            }

            .fixed-actions {
                display: none !important;
            }

            .page-body {
                padding: 0;
                margin: 0;
            }

            .a4-page {
                box-shadow: none;
                margin: 0;
                width: 100%;
                min-height: initial;
                padding: 0;
                page-break-after: always;
                border: none;
            }

            .a4-page:last-child {
                page-break-after: auto;
            }

            .items-table thead {
                display: table-header-group;
                background-color: #f8f9fa !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            .items-table tbody tr {
                page-break-inside: avoid;
            }

            .items-table,
            .document-footer {
                page-break-inside: auto;
            }

            body {
                counter-reset: page;
            }

            .page-number {
                display: block;
                position: absolute;
                bottom: 10px;
                right: 20px;
                font-size: 9pt;
            }

            .page-number::after {
                counter-increment: page;
                content: "หน้า " counter(page);
            }
        }
    </style>
</head>

<body>
    <!-- Fixed Actions for Screen -->
    <div class="fixed-actions d-print-none">
        <a href="/invoices.html" class="btn btn-outline-secondary">
            <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-arrow-left" width="24"
                height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none"
                stroke-linecap="round" stroke-linejoin="round">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path d="M5 12l14 0" />
                <path d="M5 12l6 6" />
                <path d="M5 12l6 -6" />
            </svg>
            กลับ
        </a>
        <button type="button" class="btn btn-primary" onclick="window.print();">
            <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-printer" width="24" height="24"
                viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round"
                stroke-linejoin="round">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path d="M17 17h2a2 2 0 0 0 2 -2v-4a2 2 0 0 0 -2 -2h-14a2 2 0 0 0 -2 2v4a2 2 0 0 0 2 2h2" />
                <path d="M17 9v-4a2 2 0 0 0 -2 -2h-6a2 2 0 0 0 -2 2v4" />
                <path d="M7 13m0 2a2 2 0 0 1 2 -2h6a2 2 0 0 1 2 2v4a2 2 0 0 1 -2 2h-6a2 2 0 0 1 -2 -2z" />
            </svg>
            พิมพ์
        </button>
    </div>

    <!-- Main Content Area -->
    <div class="page-body" id="page-content-wrapper">
        <div class="container text-center mt-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p>กำลังโหลดข้อมูล...</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const urlParams = new URLSearchParams(window.location.search);
            const invoiceId = urlParams.get('id');

            if (!invoiceId) {
                document.getElementById('page-content-wrapper').innerHTML = '<div class="container text-center mt-5"><h1>ไม่พบ ID ใบแจ้งหนี้</h1></div>';
                return;
            }

            const formatDate = (dateString) => {
                if (!dateString) return '-';
                const date = new Date(dateString);
                return date.toLocaleDateString('th-TH', { day: '2-digit', month: '2-digit', year: 'numeric' });
            };
            const formatCurrency = (num) => {
                if (num === null || num === undefined) return '0.00';
                return Number(num).toFixed(2).replace(/\d(?=(\d{3})+\.)/g, '$&,');
            };

            // ===== START: Bahttext V2 (Corrected) =====
            function bahttext(number) {
                if (number === null || isNaN(number) || number === 0) {
                    return "ศูนย์บาทถ้วน";
                }

                const thaiNumbers = ["ศูนย์", "หนึ่ง", "สอง", "สาม", "สี่", "ห้า", "หก", "เจ็ด", "แปด", "เก้า"];
                const thaiUnits = ["", "สิบ", "ร้อย", "พัน", "หมื่น", "แสน", "ล้าน"];

                let [baht, satang] = Number(number).toFixed(2).split('.').map(part => parseInt(part));

                function convertInteger(numStr) {
                    let output = "";
                    const len = numStr.length;

                    if (len > 7) {
                        const millionPart = numStr.substring(0, len - 6);
                        const remainingPart = numStr.substring(len - 6);
                        output = convertInteger(millionPart) + "ล้าน" + convertInteger(remainingPart);
                        return output;
                    }

                    for (let i = 0; i < len; i++) {
                        const digit = parseInt(numStr[i]);
                        if (digit === 0) continue;

                        const unit = thaiUnits[len - i - 1];
                        let digitText = thaiNumbers[digit];

                        if (unit === 'สิบ' && digit === 2) digitText = "ยี่";
                        if (unit === 'สิบ' && digit === 1) digitText = "";
                        if (len > 1 && unit === '' && digit === 1 && parseInt(numStr[len - 2]) !== 0) digitText = "เอ็ด";

                        output += digitText + unit;
                    }
                    return output;
                }

                let bahtText = convertInteger(baht.toString());
                let satangText = "";

                if (satang > 0) {
                    const satangStr = satang.toString().padStart(2, '0');
                    let tempSatang = "";
                    const d1 = parseInt(satangStr[0]);
                    const d2 = parseInt(satangStr[1]);

                    if (d1 > 0) {
                        tempSatang += (d1 === 2 ? "ยี่" : thaiNumbers[d1]) + "สิบ";
                    }
                    if (d2 > 0) {
                        tempSatang += (d1 > 0 && d2 === 1 ? "เอ็ด" : thaiNumbers[d2]);
                    }
                    satangText = tempSatang + "สตางค์";
                } else {
                    satangText = "ถ้วน";
                }

                bahtText = bahtText.replace(/^หนึ่งล้าน/, "เอ็ดล้าน");

                return bahtText + "บาท" + satangText;
            }
            // ===== END: Bahttext V2 =====

            function createPageHTML(details, pageItems) {
                let branchText = 'สำนักงานใหญ่';
                if (details.branch_code || details.branch_name) {
                    branchText = `${details.branch_name || ''} ${details.branch_code || ''}`.trim();
                }

                const headerHTML = `
                    <div class="document-header">
                        <div class="company-logo">
                            <img src="/uploads/items/espa-logo.png" alt="ES-PA Engineering Logo" style="max-width: 100px; height: auto;">
                        </div>
                        <div class="company-details">
                            <p style="font-size: 1.1rem; font-weight: bold; margin: 0;">บริษัท เอส ป้า เอ็นจิเนียริ่ง จำกัด</p>
                            99/2 หมู่ 2 ต.บ่อตาโล่ อ.วังน้อย จ.พระนครศรีอยุธยา 13170<br>
                            Tel: 089-1804303 เลขประจำตัวผู้เสียภาษีอากร 0135555011210
                        </div>
                    </div>
                    <div class="document-title">
                        <h2 style="margin:0; font-weight: bold;">ใบแจ้งหนี้ / INVOICE</h2>
                        (ต้นฉบับ / Original)
                    </div>
                    <div class="document-meta">
                        <div class="customer-box">
                            <strong>ชื่อลูกค้า:</strong>
                            <div style="padding-left: 1rem; padding-top: 0.5rem;">
                                <strong>${details.customer_name || ''}</strong><br>
                                ${details.customer_address || ''} ${branchText}<br>
                                Tax ID: ${details.customer_tax_id || '-'}
                            </div>
                        </div>
                        <div class="document-info">
                             <p><strong>เลขที่/No:</strong> <span>${details.invoice_number}</span></p>
                             <p><strong>วันที่/Date:</strong> <span>${formatDate(details.issue_date)}</span></p>
                             <p><strong>อ้างอิง PO No:</strong> <span>${details.customer_po_number || '-'}</span></p>
                             </div>
                    </div>
                `;

                // Width adjustments requested by User: 
                // Increased Ref DO No. width to 20%
                const tableHeaderHTML = `
                    <thead>
                        <tr>
                            <th class="text-center" style="width: 5%;">ลำดับ</th>
                            <th class="text-center" style="width: 15%;">รหัสสินค้า</th>
                            <th>รายการ</th>
                            <th class="text-center" style="width: 20%;">อ้างอิง DO No.</th>
                            <th class="text-center" style="width: 10%;">จำนวน</th>
                            <th class="text-right" style="width: 12%;">ราคา/หน่วย</th>
                            <th class="text-right" style="width: 13%;">จำนวนเงิน</th>
                        </tr>
                    </thead>
                `;

                // Set to 10 rows per page to fit single A4 page better
                const ROWS_PER_PAGE = 10;
                let itemsHTML = pageItems.map((item, index) => `
                    <tr>
                        <td class="text-center">${item.originalIndex + 1}</td>
                        <td class="text-center">${item.item_code}</td>
                        <td>${item.description}</td>
                        <td class="text-center">${item.ref_do_numbers || '-'}</td>
                        <td class="text-center">${item.quantity.toLocaleString()}</td>
                        <td class="text-right">${formatCurrency(item.unit_price)}</td>
                        <td class="text-right">${formatCurrency(item.total_price)}</td>
                    </tr>
                `).join('');

                const emptyRowsNeeded = ROWS_PER_PAGE - pageItems.length;
                if (emptyRowsNeeded > 0) {
                    for (let i = 0; i < emptyRowsNeeded; i++) {
                        itemsHTML += '<tr><td>&nbsp;</td><td></td><td></td><td></td><td></td><td></td><td></td></tr>';
                    }
                }

                const footerHTML = `
                    <div class="document-footer">
                        <div class="row g-2">
                            <div class="col-7">
                                <div><strong>Comment:</strong></div>
                                <div class="mt-2"><strong>(Baht)บาท :</strong> <span class="text-decoration-underline">${bahttext(details.grand_total)}</span></div>
                                <div class="mt-3">
                                    <strong>หมายเหตุ</strong>
                                    <ul style="padding-left: 1.2rem; margin-top: 0.2rem; font-size: 0.8rem;">
                                       <li>ผู้ซื้อได้รับสินค้ารายการเอกสารนี้ในสภาพที่ดีและถูกต้องแล้ว</li>
                                       <li>กรุณาตรวจสอบจำนวนเงินและสินค้าที่ซื้อในใบแจ้งหนี้ฯ จะไม่รับคืนสินค้ายกเว้นแต่เป็นสินค้าที่มีปัญหา ให้แจ้งภายใน 7 วัน นับจากวันที่ได้รับสินค้าแล้ว</li>
                                       <li>สินค้าที่ได้รับตามรายการข้างบนนี้ หากผิดพลาดประการใด กรุณาแจ้งให้ทราบภายใน 7 วัน มิฉะนั้น บริษัทฯ จะถือว่าถูกต้องทั้งหมด</li>
                                    </ul>
                                </div>
                            </div>
                            <div class="col-5">
                                 <table class="summary-table">
                                    <tbody>
                                        <tr>
                                            <td>Nat Amt</td>
                                            <td class="text-right">${formatCurrency(details.sub_total)}</td>
                                            <td class="text-center">THB</td>
                                        </tr>
                                        <tr>
                                            <td>VAT(7%)</td>
                                            <td class="text-right">${formatCurrency(details.tax_amount)}</td>
                                            <td class="text-center">THB</td>
                                        </tr>
                                        <tr>
                                            <td class="fw-bold">Total(AMT)</td>
                                            <td class="text-right fw-bold">${formatCurrency(details.grand_total)}</td>
                                            <td class="text-center fw-bold">THB</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <div class="signature-section">
                           <div class="signature-box">
                                ได้รับสินค้าตามรายการข้างต้น<br>โดยถูกต้องเรียบร้อยแล้ว
                                <div class="signature-line"></div>
                                <div><strong>ผู้รับสินค้า</strong></div>
                                <div>(Date)วันที่: ......./......./.........</div>
                           </div>
                           <div class="signature-box">
                                ได้ส่งสินค้าตามรายการข้างต้น<br>โดยถูกต้องเรียบร้อยแล้ว
                                <div class="signature-line"></div>
                                <div><strong>ผู้ส่งสินค้า</strong></div>
                                <div>(Date)วันที่: ......./......./.........</div>
                           </div>
                           <div class="signature-box">
                                ในนาม บริษัท เอส ป้า เอ็นจิเนียริ่ง จำกัด<br>For ES PA ENGINEERING Co., Ltd.
                               <div class="signature-line"></div>
                               <div><strong>ผู้อนุมัติ / APPROVED</strong></div>
                               <div>(Date)วันที่: ......./......./.........</div>
                           </div>
                        </div>
                    </div>
                `;

                return `<div class="a4-page"><div class="main-content">${headerHTML}<table class="items-table">${tableHeaderHTML}<tbody>${itemsHTML}</tbody></table>${footerHTML}</div><div class="page-number"></div></div>`;
            }

            fetch(`/api/invoices/${invoiceId}`)
                .then(response => response.ok ? response.json() : Promise.reject('Network error'))
                .then(async result => {
                    if (!result.success) throw new Error(result.error);
                    let { details, items } = result.data;

                    // Fallback: If branch info is missing (backend api not updated/restarted), fetch it manually
                    if (details.customer_id && typeof details.branch_code === 'undefined') {
                        try {
                            const entityRes = await fetch(`/api/entities?type=customer`);
                            if (entityRes.ok) {
                                const entityData = await entityRes.json();
                                const customer = entityData.data.find(e => e.id == details.customer_id);
                                if (customer) {
                                    details.branch_code = customer.branch_code;
                                    details.branch_name = customer.branch_name;
                                }
                            }
                        } catch (e) { console.warn("Fallback fetch for branch info failed", e); }
                    }

                    document.title = `Invoice ${details.invoice_number} - Smart Factory`;

                    const pageWrapper = document.getElementById('page-content-wrapper');
                    pageWrapper.innerHTML = '';

                    const ROWS_PER_PAGE = 10; // Match the constant in createPageHTML
                    const itemsWithIndex = items.map((item, index) => ({ ...item, originalIndex: index }));

                    for (let i = 0; i < itemsWithIndex.length; i += ROWS_PER_PAGE) {
                        const pageItems = itemsWithIndex.slice(i, i + ROWS_PER_PAGE);
                        pageWrapper.innerHTML += createPageHTML(details, pageItems);
                    }
                })
                .catch(error => {
                    console.error('Error fetching Invoice details:', error);
                    document.getElementById('page-content-wrapper').innerHTML = `<div class="container text-center text-danger mt-5"><h3>เกิดข้อผิดพลาดในการโหลดข้อมูล</h3><p>${error.message || ''}</p></div>`;
                });
        });
    </script>
</body>

</html>
